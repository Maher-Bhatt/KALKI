name: KALKI Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Installers
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          
      - name: Setup Inno Setup
        run: choco install innosetup -y
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pyinstaller playwright psutil wmi comtypes pycaw
          
      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          
      - name: Generate config.py (if missing)
        run: |
          cd app
          if (!(Test-Path config.py)) {
            Copy-Item config.example.py config.py
          }
          
      - name: Build EXE and MSIX
        run: |
          cd app
          python build_tools/build_installer.py
          
      - name: Publish Cloud Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Output/KALKI_Setup.exe
            Output/KALKI.msix
            
      - name: Upload Artifacts (Non-Tag Builds)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: KALKI-Installers
          path: |
            Output/KALKI_Setup.exe
            Output/KALKI.msix
