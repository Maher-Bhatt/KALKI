<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KALKI Desktop Companion</title>
<style>
  /* ==========================================================================
     KALKI FILAMENT DESIGN SYSTEM
     Cold Machined Graphite Surfaces • Warm Ivory Filament Light
     ========================================================================== */
  :root {
    --void: #070809;
    --inset: #0a0c0e;
    --base: #0d0f12;
    --raised: #191d22;
    --overlay: #262c33;
    --line: #333b44;
    --lst: #59636f;
    --text: #e6ebef;
    --t2: #b3bcc6;
    --mut: #8a95a1;
    --fil: #fff4e2;
    --fil-glow: rgba(255, 244, 226, 0.28);
    --fil-dim: rgba(255, 244, 226, 0.08);
    --ok: #4cc061;
    --warn: #e08c33;
    --aura-color: var(--fil);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  
  html, body {
    width: 100vw;
    height: 100vh;
    background: transparent !important;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
  }

  /* Main Container docked to bottom right */
  #pet-root {
    position: absolute;
    bottom: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    width: 250px;
  }

  /* Draggable Handle & Pet Avatar */
  .pet-character-wrap {
    position: relative;
    width: 110px;
    height: 110px;
    cursor: grab;
    -webkit-app-region: drag;
    display: grid;
    place-items: center;
    filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.7));
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .pet-character-wrap:active { cursor: grabbing; }

  /* Aura Ring in Warm Filament Glow */
  .pet-aura {
    position: absolute;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--fil-glow) 0%, rgba(255, 244, 226, 0.05) 55%, transparent 75%);
    opacity: 0.35;
    animation: auraPulse 3.5s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes auraPulse {
    0%, 100% { transform: scale(0.92); opacity: 0.25; }
    50%      { transform: scale(1.14); opacity: 0.55; }
  }

  /* Floating speech bubble */
  .speech-bubble {
    width: 242px;
    background: rgba(13, 15, 18, 0.94);
    border: 1px solid var(--line);
    border-top: 2px solid var(--fil);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.75), 0 0 16px var(--fil-dim);
    backdrop-filter: blur(16px);
    display: none;
    flex-direction: column;
    gap: 8px;
    -webkit-app-region: no-drag;
    animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .speech-bubble.active { display: flex; }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(10px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bubble-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .bubble-title {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--fil);
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: monospace;
  }
  .bubble-close-btn {
    background: transparent;
    border: none;
    color: var(--mut);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    transition: all 0.15s;
  }
  .bubble-close-btn:hover { color: var(--fil); background: rgba(255, 255, 255, 0.08); }

  .bubble-content {
    font-size: 12px;
    color: var(--t2);
    line-height: 1.45;
    max-height: 110px;
    overflow-y: auto;
    word-break: break-word;
  }
  .bubble-content strong { color: var(--fil); }

  .bubble-input-row {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .bubble-input {
    flex: 1;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--void);
    color: var(--text);
    font-size: 11.5px;
    padding: 0 8px;
    outline: none;
    transition: border-color 0.15s;
  }
  .bubble-input:focus { border-color: var(--fil); }
  .bubble-send-btn {
    height: 28px;
    padding: 0 10px;
    background: var(--fil);
    color: #070809;
    border: none;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.15s;
  }
  .bubble-send-btn:hover { box-shadow: 0 0 10px var(--fil-glow); }

  .quick-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 2px;
  }
  .q-chip {
    font-size: 10px;
    padding: 3px 7px;
    border-radius: 4px;
    background: var(--raised);
    color: var(--t2);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: all 0.15s;
  }
  .q-chip:hover {
    background: var(--overlay);
    color: var(--fil);
    border-color: var(--lst);
  }

  /* Animations for pet body parts */
  @keyframes petBreathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50%      { transform: scale(1.03) translateY(-2px); }
  }
  @keyframes petTailWag {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(18deg); }
  }
  @keyframes petEarTwitch {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-10deg); }
  }
  @keyframes petDanceBob {
    0%   { transform: rotate(-6deg) translateY(0); }
    50%  { transform: rotate(0deg) translateY(-10px); }
    100% { transform: rotate(6deg) translateY(0); }
  }
  @keyframes floatNote {
    0%   { opacity: 1; transform: translateY(0) scale(0.8) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-42px) scale(1.3) rotate(20deg); }
  }

  .pet-svg {
    width: 90px;
    height: 90px;
    animation: petBreathe 3.4s ease-in-out infinite;
    pointer-events: auto;
  }

  /* Dancing state triggered when music is playing */
  .is-dancing .pet-svg {
    animation: petDanceBob 0.48s cubic-bezier(0.2, 0.8, 0.4, 1) infinite alternate !important;
  }
  .is-dancing .pet-aura {
    animation: auraPulse 0.48s ease-in-out infinite alternate !important;
    opacity: 0.6;
  }

  .floating-note {
    position: absolute;
    font-size: 18px;
    color: var(--fil);
    pointer-events: none;
    z-index: 50;
    text-shadow: 0 0 8px var(--fil-glow);
    animation: floatNote 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  /* Badge and control bar under pet */
  .pet-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(13, 15, 18, 0.92);
    border: 1px solid var(--line);
    padding: 3px 8px;
    border-radius: 12px;
    backdrop-filter: blur(10px);
    -webkit-app-region: no-drag;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .pet-name-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--fil);
  }
  .pet-mood-tag {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(76, 192, 97, 0.12);
    color: var(--ok);
    border: 1px solid rgba(76, 192, 97, 0.25);
    font-family: monospace;
  }
  .btn-mini {
    background: transparent;
    border: none;
    color: var(--mut);
    cursor: pointer;
    font-size: 11px;
    padding: 1px 3px;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .btn-mini:hover { color: var(--fil); background: rgba(255, 255, 255, 0.1); }
</style>
</head>
<body>

<div id="pet-root">
  <!-- Interactive speech bubble -->
  <div class="speech-bubble" id="speech-bubble">
    <div class="bubble-header">
      <span class="bubble-title">
        <span id="bubble-species-icon">🐱</span>
        <span id="bubble-species-name">GOBI // COMPANION</span>
      </span>
      <button class="bubble-close-btn" id="bubble-close">✕</button>

<script>
/* ==========================================================================
   Procedural Sound Synthesizer (Web Audio API)
   ========================================================================== */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }
  async init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
    }
    if (this.ctx.state === 'suspended') {
      await this.ctx.resume();
    }
    return this.ctx;
  }
  async playPurr() {
    if (this.muted) return;
    const ctx = await this.init();
    if (!ctx) return;
    try {
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(740, now + 0.14);
      osc.frequency.exponentialRampToValueAtTime(420, now + 0.32);
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.16, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.35);
    } catch(e) {}
  }
  async playChime() {
    if (this.muted) return;
    const ctx = await this.init();
    if (!ctx) return;
    try {
      const now = ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.07);
        gain.gain.setValueAtTime(0.08, now + idx * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.07);
        osc.stop(now + idx * 0.07 + 0.29);
      });
    } catch(e) {}
  }
}
const sounds = new SoundEngine();

/* ==========================================================================
   Full 6 Companion Species in Filament Design System
   ========================================================================== */
const PET_SVGS = {
  // 1. Gobi (Sentient AI Kitten)
  gobi: `<svg class="pet-svg" viewBox="0 0 100 100">

    <path d="M 45 60 Q 50 65 55 60" stroke="#fff4e2" stroke-width="2.5" fill="none" stroke-linecap="round" />

  // 2. Kittu (Cyber Shiba)
  kittu: `<svg class="pet-svg" viewBox="0 0 100 100">
    <ellipse cx="74" cy="70" rx="12" ry="5" fill="#e08c33" style="transform-origin:65px 70px; animation:petTailWag 0.9s ease-in-out infinite;" />
    <rect x="25" y="32" width="50" height="44" rx="14" fill="#191d22" stroke="#59636f" stroke-width="2.2" />
    <polygon points="28,32 18,12 38,26" fill="#e08c33" />
    <polygon points="72,32 82,12 62,26" fill="#e08c33" />
    <ellipse cx="50" cy="58" rx="16" ry="12" fill="#fff4e2" />
    <circle cx="50" cy="54" r="3.5" fill="#070809" />
    <circle cx="40" cy="48" r="4.5" fill="#fff4e2" />

    <circle cx="41.2" cy="47" r="1.5" fill="#070809" />
    <circle cx="61.2" cy="47" r="1.5" fill="#070809" />
  </svg>`,

  // 3. Byte (Glitch Sprite)
  byte: `<svg class="pet-svg" viewBox="0 0 100 100">
    <rect x="24" y="28" width="52" height="52" rx="8" fill="#191d22" stroke="#fff4e2" stroke-width="2" />

    <line x1="50" y1="28" x2="50" y2="16" stroke="#fff4e2" stroke-width="2" />

  // 4. Draco (Cyber Dragon)
  draco: `<svg class="pet-svg" viewBox="0 0 100 100">
    <polygon points="30,28 20,10 38,24" fill="#e08c33" />
    <polygon points="70,28 80,10 62,24" fill="#e08c33" />

    <ellipse cx="40" cy="48" rx="4.5" ry="7" fill="#fff4e2" />

    <line x1="40" y1="42" x2="40" y2="54" stroke="#070809" stroke-width="2" />
    <line x1="60" y1="42" x2="60" y2="54" stroke="#070809" stroke-width="2" />
    <circle cx="47" cy="58" r="1.5" fill="#e08c33" />
    <circle cx="53" cy="58" r="1.5" fill="#e08c33" />

  // 5. Nova (Astral Focus Orb)
  nova: `<svg class="pet-svg" viewBox="0 0 100 100">
    <ellipse cx="50" cy="50" rx="34" ry="12" fill="none" stroke="#fff4e2" stroke-width="1.8" stroke-dasharray="4,3" />
    <circle cx="50" cy="50" r="24" fill="#0d0f12" stroke="#59636f" stroke-width="2" />
    <circle cx="50" cy="50" r="14" fill="#191d22" />
    <circle cx="50" cy="50" r="7" fill="#fff4e2" />

  // 6. Kitsu (Nine-Tailed Kitsune)
  kitsu: `<svg class="pet-svg" viewBox="0 0 100 100">
    <ellipse cx="76" cy="68" rx="14" ry="5" fill="#e08c33" opacity="0.6" style="transform-origin:65px 68px; animation:petTailWag 1.4s ease-in-out infinite;" />
    <rect x="25" y="32" width="50" height="44" rx="14" fill="#fff4e2" stroke="#333b44" stroke-width="2" />
    <polygon points="28,32 18,14 38,26" fill="#e08c33" />
    <polygon points="72,32 82,14 62,26" fill="#e08c33" />
    <circle cx="40" cy="50" r="4.5" fill="#070809" />
    <circle cx="60" cy="50" r="4.5" fill="#070809" />
    <circle cx="41.2" cy="49" r="1.5" fill="#fff4e2" />
    <circle cx="61.2" cy="49" r="1.5" fill="#fff4e2" />
  </svg>`
};

const SPECIES = ['gobi', 'kittu', 'byte', 'draco', 'nova', 'kitsu'];
const NAMES = {
  gobi: 'Gobi',
  kittu: 'Kittu',
  byte: 'Byte',
  draco: 'Draco',
  nova: 'Nova',
  kitsu: 'Kitsu'
};
const ROLES = {
  gobi: 'AI Kitten • Beat Sync',
  kittu: 'Cyber Shiba • Guard',
  byte: 'Glitch Sprite • Code',
  draco: 'Mini Dragon • Compute',
  nova: 'Astral Orb • Focus',
  kitsu: 'Kitsune • Vault'
};
const ICONS = {
  gobi: '🐱',
  kittu: '🐕',
  byte: '👾',
  draco: '🐉',
  nova: '🔮',
  kitsu: '🦊'
};

const API_BASE = (window.location.protocol.startsWith('http'))
  ? window.location.origin
  : 'http://127.0.0.1:8888';

let currentSpeciesIdx = 0;
let isDancing = false;

function setSpecies(idx, syncServer = true) {
  currentSpeciesIdx = (idx + SPECIES.length) % SPECIES.length;
  const sp = SPECIES[currentSpeciesIdx];
  const name = NAMES[sp];
  
  document.getElementById('pet-svg-container').innerHTML = PET_SVGS[sp] || PET_SVGS.gobi;
  document.getElementById('pill-name').textContent = name;
  document.getElementById('bubble-species-name').textContent = `${name.toUpperCase()} // ${ROLES[sp].toUpperCase()}`;
  document.getElementById('bubble-species-icon').textContent = ICONS[sp];

  if (syncServer && window.pywebview && window.pywebview.api && window.pywebview.api.save_pet_state) {
    try {
      window.pywebview.api.save_pet_state({ species: sp, name: name });
    } catch(e) {}
  }
}

async function initPetState() {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.get_pet_state) {
    try {
      const saved = await window.pywebview.api.get_pet_state();
      if (saved && saved.species) {
        const found = SPECIES.indexOf(saved.species);
        if (found !== -1) {
          setSpecies(found, false);
          return;
        }
      }
    } catch(e) {}
  }
  setSpecies(0, false);
}
initPetState();

// Elements & Listeners
const petWrap = document.getElementById('pet-wrap');
const speechBubble = document.getElementById('speech-bubble');
const bubbleClose = document.getElementById('bubble-close');
const bubbleText = document.getElementById('bubble-text');
const bubbleInp = document.getElementById('bubble-inp');
const bubbleSend = document.getElementById('bubble-send');
const pillMood = document.getElementById('pill-mood');

petWrap.addEventListener('click', () => {
  sounds.playPurr();
  speechBubble.classList.toggle('active');
  if (speechBubble.classList.contains('active')) {
    bubbleInp.focus();
  }
  // Instantly bring main KALKI workspace to the foreground
  if (window.pywebview && window.pywebview.api && window.pywebview.api.open_main_app) {
    window.pywebview.api.open_main_app();
  }
});

bubbleClose.addEventListener('click', () => {
  speechBubble.classList.remove('active');
});

document.getElementById('chip-open-kalki').addEventListener('click', () => {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.open_main_app) {
    window.pywebview.api.open_main_app();
  }
  bubbleText.innerHTML = "Restoring main KALKI workspace...";
});

document.querySelectorAll('.q-chip[data-cmd]').forEach(chip => {
  chip.addEventListener('click', () => {
    sendQuery(chip.getAttribute('data-cmd'));
  });
});

document.getElementById('btn-next-pet').addEventListener('click', () => {
  sounds.playChime();
  setSpecies(currentSpeciesIdx + 1, true);
});

const btnSound = document.getElementById('btn-pet-sound');
btnSound.addEventListener('click', () => {
  sounds.muted = !sounds.muted;
  btnSound.textContent = sounds.muted ? '🔇' : '🔊';
  if (!sounds.muted) sounds.playPurr();
});

document.getElementById('btn-pet-wake').addEventListener('click', () => {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.open_main_app) {
    window.pywebview.api.open_main_app();
  }
});

// Query Dispatcher to Loopback API
async function sendQuery(q) {
  if (!q.trim()) return;
  sounds.playChime();
  bubbleText.innerHTML = "<em>Thinking...</em>";
  speechBubble.classList.add('active');
  pillMood.textContent = "Processing";

  try {
    const res = await fetch(`${API_BASE}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [{ role: 'user', content: q.trim() }],
        source: 'desktop_pet',
        stream: false
      })
    });
    const data = await res.json();
    if (data.reply) {
      bubbleText.innerHTML = data.reply.replace(/\n/g, '<br>');
      pillMood.textContent = "Ready";
    } else {
      bubbleText.textContent = "Request processed.";
      pillMood.textContent = "Ready";
    }
  } catch (err) {
    // If backend is busy, still acknowledge
    bubbleText.textContent = `Command "${q}" dispatched. Restoring workspace...`;
    pillMood.textContent = "Ready";
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.open_main_app();
    }
  }
}

bubbleInp.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const v = bubbleInp.value;
    bubbleInp.value = '';
    sendQuery(v);
  }
});

bubbleSend.addEventListener('click', () => {
  const v = bubbleInp.value;
  bubbleInp.value = '';
  sendQuery(v);
});

// Music & Dance Loop
function spawnNote() {
  const note = document.createElement('div');
  note.className = 'floating-note';
  note.textContent = ['♪', '♫', '♬', '✨'][Math.floor(Math.random() * 4)];
  note.style.left = `${30 + Math.random() * 50}px`;
  note.style.bottom = `${80 + Math.random() * 20}px`;
  petWrap.appendChild(note);
  setTimeout(() => note.remove(), 1200);
}

setInterval(async () => {
  let media = null;
  // First attempt native Python WinRT query
  if (window.pywebview && window.pywebview.api && window.pywebview.api.get_music_state) {
    try {
      media = await window.pywebview.api.get_music_state();
    } catch(e) {}
  }
  // Fallback to loopback HTTP
  if (!media) {
    try {
      const r = await fetch(`${API_BASE}/api/media/now_json`);
      if (r.ok) media = await r.json();
    } catch(e) {}
  }

  if (media) {
    const playing = media.status === 'playing' || (media.title && media.title !== 'Nothing playing' && media.title !== 'Unknown');
    if (playing !== isDancing) {
      isDancing = playing;
      petWrap.classList.toggle('is-dancing', isDancing);
      pillMood.textContent = isDancing ? "Jamming ♪" : "Ready";
      if (isDancing) {
        bubbleText.textContent = `Grooving to ${media.title || 'music'}!`;
      }
    }
    if (isDancing && Math.random() > 0.4) {
      spawnNote();
    }
  }
}, 1600);
</script>
