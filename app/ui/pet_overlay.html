<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALKI Pet</title>
<style>
  :root {
    --panel: #15181c; --line: #333b44; --text: #e6ebef; --mut: #9aa5b1; --warm: #fff4e2; --warn: #ffb347;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #15181c; overflow: hidden; font: 400 13px/18px var(--font); color: var(--text); user-select: none; }
  button, input { font: inherit; color: inherit; }
  #root { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; gap: 6px; padding: 4px; }

  #card { display: none; width: 100%; flex: 0 1 auto; min-height: 0; flex-direction: column; gap: 10px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  body.open #card { display: flex; }
  .head { display: flex; align-items: center; gap: 8px; }
  .head strong { font-weight: 600; }
  #status { color: var(--mut); font-size: 12px; }
  .spacer { flex: 1; }
  .icon { width: 26px; height: 26px; border: 0; border-radius: 6px; background: none; color: var(--mut); cursor: pointer; }
  .icon:hover { background: #262c33; color: var(--text); }
  #reply { flex: 1; min-height: 0; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
  #reply:empty { display: none; }
  .row { display: flex; gap: 6px; }
  .btn { flex: 1; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: #191d22; cursor: pointer; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .btn:hover { border-color: #59636f; background: #262c33; }
  .btn.main { background: var(--warm); border-color: var(--warm); color: #17191c; }
  body[data-state="waiting"] #open { background: var(--warn); border-color: var(--warn); }
  #ask { flex: 1; min-width: 0; height: 32px; padding: 0 10px; background: #0a0c0e; border: 1px solid var(--line); border-radius: 7px; outline: none; }
  #ask:focus { border-color: var(--warm); }
  #reply { max-height: 180px; }
  /* Desktop app: this page is only the card, and fills its window. */
  body.native-pet #root { padding: 0; display: block; }
  body.native-pet #pet { position: absolute; left: -9999px; }
  body.native-pet #card { display: flex; border: 0; border-radius: 0; }
  :focus-visible { outline: 2px solid var(--warm); outline-offset: 1px; }

  #pet { position: relative; width: 96px; height: 96px; flex: none; border: 0; background: none; cursor: pointer; }
  #sprite { width: 96px; height: 96px; image-rendering: pixelated; display: block; }
</style>
</head>
<body data-state="idle">
<div id="root">
  <section id="card" aria-label="KALKI pet">
    <div class="head">
      <div><strong id="name">Gobi</strong><br><span id="status" role="status">Ready</span></div>
      <span class="spacer"></span>
      <button class="icon" id="next" type="button" title="Change pet" aria-label="Change pet">&#8635;</button>
      <button class="icon" id="sound" type="button" title="Sound" aria-label="Sound" aria-pressed="false">&#9834;</button>
      <button class="icon" id="hide" type="button" title="Close the pet" aria-label="Close the pet">&#10005;</button>
    </div>
    <div id="reply"></div>
    <div class="row"><button class="btn main" id="open" type="button">Open KALKI</button></div>
    <form class="row" id="form"><input id="ask" type="text" placeholder="Ask KALKI" aria-label="Ask KALKI" autocomplete="off"></form>
  </section>
  <button id="pet" type="button" title="Click to open. Drag to move.">
    <canvas id="sprite"></canvas>
  </button>
</div>

<script src="pet_sprites.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='/ui/pet_sprites.js';s.onload=function(){window.__petStart&&window.__petStart()};document.head.appendChild(s)"></script>
<script>
(function () {
  'use strict';
  const POLL_MS = 1500;
  const DONE_MS = 4000;
  const SIZE_CLOSED = [104, 104];
  const SIZE_OPEN = [280, 330];
  const $ = (id) => document.getElementById(id);

  function start() {
    const Pets = window.KalkiPets;
    if (!Pets || start.done) return;
    start.done = true;

    const pet = { species: 'gobi', name: 'Gobi', sound: false };
    const player = Pets.createPlayer($('sprite'), { species: pet.species, fps: 5, keepRunning: true });
    let view = { pending: 0, working: false, listening: false, music: false };
    let lastActive = Date.now();
    let doneUntil = 0;
    let wasWorking = false;
    let reachable = true;
    let shown = null;
    let audio = null;

    const native = () => window.pywebview && window.pywebview.api;

    function chirp(freq) {
      if (!pet.sound) return;
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.06, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.14);
        osc.connect(gain);
        gain.connect(audio.destination);
        osc.start();
        osc.stop(audio.currentTime + 0.14);
      } catch (e) { /* Sound is a nicety. */ }
    }

    function paint() {
      const state = Pets.resolveState({
        pending: view.pending,
        working: view.working,
        listening: view.listening,
        doneRecently: Date.now() < doneUntil,
        music: view.music,
        idleMs: Date.now() - lastActive,
      });
      const label = reachable ? Pets.LABELS[state] : "KALKI isn't running";
      if (state !== shown) {
        if (state === 'waiting') chirp(660);
        if (state === 'done') chirp(880);
        shown = state;
      }
      document.body.dataset.state = state;
      player.set({ species: pet.species, state });
      $('name').textContent = pet.name;
      $('status').textContent = label;
      $('pet').setAttribute('aria-label', pet.name + ': ' + label);
      $('open').textContent = state === 'waiting' ? 'Review in KALKI' : 'Open KALKI';
      $('sound').setAttribute('aria-pressed', String(!!pet.sound));
      $('sound').style.color = pet.sound ? 'var(--warm)' : '';
    }

    async function readStatus() {
      if (native() && native().get_status) return native().get_status();
      const res = await fetch('/api/pet/status');
      if (!res.ok) throw new Error('status ' + res.status);
      return res.json();
    }

    async function poll() {
      try {
        const data = await readStatus();
        if (!data || data.ok === false) throw new Error('unreachable');
        reachable = true;
        view = { pending: data.pending || 0, working: !!data.working, listening: !!data.listening, music: !!data.music };
        if (wasWorking && !view.working) doneUntil = Date.now() + DONE_MS;
        if (view.working) lastActive = Date.now();
        wasWorking = view.working;
        if (data.pet) {
          pet.species = Pets.normalize(data.pet.species);
          pet.name = data.pet.name || Pets.SPECIES[pet.species].name;
          if (typeof data.pet.sound === 'boolean') pet.sound = data.pet.sound;
        }
      } catch (e) {
        reachable = false;
        view = { pending: 0, working: false, listening: false, music: false };
      }
      paint();
    }

    async function persist() {
      const body = { species: pet.species, name: pet.name, sound: pet.sound };
      if (native() && native().save_pet) { await native().save_pet(body); return; }
      await fetch('/api/pet', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }

    /* In the desktop app the pet lives in its own see-through window, and this page is
       only the card. Each frame is sent across as it's drawn. */
    let lastFrame = '';
    let sending = false;
    async function sendFrame() {
      if (!native() || !native().show_frame || sending) return;
      const canvas = $('sprite');
      const pixels = canvas.getContext('2d').getImageData(0, 0, Pets.SIZE, Pets.SIZE).data;
      let text = '';
      for (let i = 0; i < pixels.length; i += 1) text += String.fromCharCode(pixels[i]);
      const frame = btoa(text);
      if (frame === lastFrame) return;
      lastFrame = frame;
      sending = true;
      try { await native().show_frame(frame); } finally { sending = false; }
    }

    let isOpen = false;
    function cardHeight() { return Math.ceil($('card').scrollHeight); }

    async function setOpen(open) {
      isOpen = open;
      document.body.classList.toggle('open', open);
      if (native() && native().place_card) await native().place_card(open, cardHeight());
      if (open) setTimeout(() => $('ask').focus(), 60);
    }
    window.__petClicked = () => { lastActive = Date.now(); setOpen(!isOpen); paint(); };

    async function connectNative() {
      if (native() && native().has_native_pet && await native().has_native_pet()) {
        document.body.classList.add('native-pet');
        new ResizeObserver(() => { if (isOpen) native().place_card(true, cardHeight()); }).observe($('card'));
      }
      lastFrame = '';
      sendFrame();
      poll();
    }

    async function openKalki() {
      if (native() && native().open_main_app) native().open_main_app();
      else window.open('/', '_blank');
      setOpen(false);
    }

    async function ask(text) {
      $('reply').textContent = 'Working on it…';
      try {
        let data;
        if (native() && native().send_command) {
          data = await native().send_command(text);
        } else {
          const res = await fetch('/api/command', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cmd: text }) });
          data = await res.json();
        }
        $('reply').textContent = data.reply || data.output || data.message || 'Done.';
      } catch (e) {
        $('reply').textContent = "KALKI isn't responding. Open it and try again.";
      }
    }

    $('pet').addEventListener('click', () => window.__petClicked());
    $('open').addEventListener('click', openKalki);
    $('next').addEventListener('click', () => {
      const wasDefaultName = pet.name === Pets.SPECIES[pet.species].name;
      pet.species = Pets.IDS[(Pets.IDS.indexOf(pet.species) + 1) % Pets.IDS.length];
      if (wasDefaultName) pet.name = Pets.SPECIES[pet.species].name;
      chirp(Pets.SPECIES[pet.species].tone);
      paint();
      persist().catch(() => {});
    });
    $('sound').addEventListener('click', () => { pet.sound = !pet.sound; paint(); chirp(520); persist().catch(() => {}); });
    $('hide').addEventListener('click', () => {
      if (native() && native().quit_pet) native().quit_pet();
      else window.close();
    });
    $('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = $('ask').value.trim();
      if (!text) return;
      $('ask').value = '';
      ask(text);
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });

    player.onFrame(sendFrame);
    window.addEventListener('pywebviewready', connectNative);
    if (native()) connectNative();
    paint();
    poll();
    setInterval(poll, POLL_MS);
  }

  window.__petStart = start;
  start();
})();
</script>
</body>
</html>
