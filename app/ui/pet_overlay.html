<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KALKI Desktop Companion</title>
<style>
  /* ==========================================================================
     KALKI FILAMENT DESIGN SYSTEM
     Cold Machined Graphite Surfaces • Warm Ivory Filament Light
     ========================================================================== */
  :root {
    --void: #070809;
    --inset: #0a0c0e;
    --base: #0d0f12;
    --raised: #191d22;
    --overlay: #262c33;
    --line: #333b44;
    --lst: #59636f;
    --text: #e6ebef;
    --t2: #b3bcc6;
    --mut: #8a95a1;
    --fil: #fff4e2;
    --fil-glow: rgba(255, 244, 226, 0.28);
    --fil-dim: rgba(255, 244, 226, 0.08);
    --ok: #4cc061;
    --warn: #e08c33;
    --aura-color: var(--fil);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  
  html, body {
    width: 100vw;
    height: 100vh;
    background: transparent !important;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
  }

  /* Main Container docked to bottom right */
  #pet-root {
    position: absolute;
    bottom: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    width: 250px;
  }

  /* Draggable Handle & Pet Avatar */
  .pet-character-wrap {
    position: relative;
    width: 110px;
    height: 110px;
    cursor: grab;
    -webkit-app-region: drag;
    display: grid;
    place-items: center;
    filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.7));
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .pet-character-wrap:active { cursor: grabbing; }

  /* Aura Ring in Warm Filament Glow */
  .pet-aura {
    position: absolute;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--fil-glow) 0%, rgba(255, 244, 226, 0.05) 55%, transparent 75%);
    opacity: 0.35;
    animation: auraPulse 3.5s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes auraPulse {
    0%, 100% { transform: scale(0.92); opacity: 0.25; }
    50%      { transform: scale(1.14); opacity: 0.55; }
  }

  /* Floating speech bubble */
  .speech-bubble {
    width: 242px;
    background: rgba(13, 15, 18, 0.94);
    border: 1px solid var(--line);
    border-top: 2px solid var(--fil);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.75), 0 0 16px var(--fil-dim);
    backdrop-filter: blur(16px);
    display: none;
    flex-direction: column;
    gap: 8px;
    -webkit-app-region: no-drag;
    animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .speech-bubble.active { display: flex; }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(10px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bubble-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .bubble-title {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--fil);
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: monospace;
  }
  .bubble-close-btn {
    background: transparent;
    border: none;
    color: var(--mut);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    transition: all 0.15s;
  }
  .bubble-close-btn:hover { color: var(--fil); background: rgba(255, 255, 255, 0.08); }

  .bubble-content {
    font-size: 12px;
    color: var(--t2);
    line-height: 1.45;
    max-height: 110px;
    overflow-y: auto;
    word-break: break-word;
  }
  .bubble-content strong { color: var(--fil); }

  .bubble-input-row {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .bubble-input {
    flex: 1;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--void);
    color: var(--text);
    font-size: 11.5px;
    padding: 0 8px;
    outline: none;
    transition: border-color 0.15s;
  }
  .bubble-input:focus { border-color: var(--fil); }
  .bubble-send-btn {
    height: 28px;
    padding: 0 10px;
    background: var(--fil);
    color: #070809;
    border: none;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.15s;
  }
  .bubble-send-btn:hover { box-shadow: 0 0 10px var(--fil-glow); }

  .quick-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 2px;
  }
  .q-chip {
    font-size: 10px;
    padding: 3px 7px;
    border-radius: 4px;
    background: var(--raised);
    color: var(--t2);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: all 0.15s;
  }
  .q-chip:hover {
    background: var(--overlay);
    color: var(--fil);
    border-color: var(--lst);
  }

  /* Animations for pet body parts */
  @keyframes petBreathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50%      { transform: scale(1.03) translateY(-2px); }
  }
  @keyframes petTailWag {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(18deg); }
  }
  @keyframes petEarTwitch {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-10deg); }
  }
  @keyframes petDanceBob {
    0%   { transform: rotate(-6deg) translateY(0); }
    50%  { transform: rotate(0deg) translateY(-10px); }
    100% { transform: rotate(6deg) translateY(0); }
  }
  @keyframes floatNote {
    0%   { opacity: 1; transform: translateY(0) scale(0.8) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-42px) scale(1.3) rotate(20deg); }
  }

  .pet-svg {
    width: 90px;
    height: 90px;
    animation: petBreathe 3.4s ease-in-out infinite;
    pointer-events: auto;
  }

  /* Dancing state triggered when music is playing */
  .is-dancing .pet-svg {
    animation: petDanceBob 0.48s cubic-bezier(0.2, 0.8, 0.4, 1) infinite alternate !important;
  }
  .is-dancing .pet-aura {
    animation: auraPulse 0.48s ease-in-out infinite alternate !important;
    opacity: 0.6;
  }

  .floating-note {
    position: absolute;
    font-size: 18px;
    color: var(--fil);
    pointer-events: none;
    z-index: 50;
    text-shadow: 0 0 8px var(--fil-glow);
    animation: floatNote 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  /* Badge and control bar under pet */
  .pet-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(13, 15, 18, 0.92);
    border: 1px solid var(--line);
    padding: 3px 8px;
    border-radius: 12px;
    backdrop-filter: blur(10px);
    -webkit-app-region: no-drag;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .pet-name-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--fil);
  }
  .pet-mood-tag {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(76, 192, 97, 0.12);
    color: var(--ok);
    border: 1px solid rgba(76, 192, 97, 0.25);
    font-family: monospace;
  }
  .btn-mini {
    background: transparent;
    border: none;
    color: var(--mut);
    cursor: pointer;
    font-size: 11px;
    padding: 1px 3px;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .btn-mini:hover { color: var(--fil); background: rgba(255, 255, 255, 0.1); }
</style>
</head>
<body>

<div id="pet-root">
  <!-- Interactive speech bubble -->
  <div class="speech-bubble" id="speech-bubble">
    <div class="bubble-header">
      <span class="bubble-title">
        <span id="bubble-species-icon">🐱</span>
        <span id="bubble-species-name">GOBI // COMPANION</span>
      </span>
      <button class="bubble-close-btn" id="bubble-close">✕</button>
    </div>
    
    <div class="bubble-content" id="bubble-text">
      Hey Maher! I'm guarding your screen. Click me anytime to restore KALKI or type a quick command!
    </div>

    <div class="quick-chips">
      <span class="q-chip" id="chip-open-kalki">⚡ Open KALKI</span>
      <span class="q-chip" data-cmd="system status">Health Check</span>
      <span class="q-chip" data-cmd="what is on my schedule today?">Today's Agenda</span>
      <span class="q-chip" data-cmd="lock screen">Lock Screen</span>
    </div>

    <div class="bubble-input-row">
      <input type="text" class="bubble-input" id="bubble-inp" placeholder="Ask KALKI or type command..." />
      <button class="bubble-send-btn" id="bubble-send">Send</button>
    </div>
  </div>

  <!-- Pet Character Container -->
  <div class="pet-character-wrap" id="pet-wrap" title="Click to interact / Drag to move">
    <div class="pet-aura"></div>
    <canvas id="pet-3d-canvas" width="130" height="130" style="width:120px; height:120px; cursor:grab; border-radius:50%; -webkit-app-region:drag;"></canvas>
  </div>

  <!-- Docked pill bar under pet -->
  <div class="pet-pill">
    <span class="pet-name-label" id="pill-name">Gobi</span>
    <span class="pet-mood-tag" id="pill-mood">Ready</span>
    <button class="btn-mini" id="btn-next-pet" title="Switch Companion Species">🔄</button>
    <button class="btn-mini" id="btn-pet-sound" title="Toggle Sound FX">🔊</button>
    <button class="btn-mini" id="btn-pet-wake" title="Restore KALKI Window">⚡</button>
  </div>
</div>

<script>

/* ==========================================================================
   3D Mascot Companion Engine Embedded
   ========================================================================== */
/**
 * KALKI 3D Companion Mascot Engine
 * Real-Time Isometric & Perspective 3D Polygon Rendering on HTML5 Canvas
 * Zero External Dependencies • 60 FPS • Dynamic Filament Shading & Depth Sorting
 */

(function(global) {
  'use strict';

  // Math Helpers
  const DEG2RAD = Math.PI / 180;

  function rotateX(v, angle) {
    const c = Math.cos(angle), s = Math.sin(angle);
    return { x: v.x, y: v.y * c - v.z * s, z: v.y * s + v.z * c };
  }

  function rotateY(v, angle) {
    const c = Math.cos(angle), s = Math.sin(angle);
    return { x: v.x * c + v.z * s, y: v.y, z: -v.x * s + v.z * c };
  }

  function rotateZ(v, angle) {
    const c = Math.cos(angle), s = Math.sin(angle);
    return { x: v.x * c - v.y * s, y: v.x * s + v.y * c, z: v.z };
  }

  function transformVertex(v, rx, ry, rz, tx, ty, tz) {
    let p = rotateZ(v, rz);
    p = rotateX(p, rx);
    p = rotateY(p, ry);
    return { x: p.x + tx, y: p.y + ty, z: p.z + tz };
  }

  function crossProduct(a, b) {
    return {
      x: a.y * b.z - a.z * b.y,
      y: a.z * b.x - a.x * b.z,
      z: a.x * b.y - a.y * b.x
    };
  }

  function normalize(v) {
    const len = Math.hypot(v.x, v.y, v.z) || 1;
    return { x: v.x / len, y: v.y / len, z: v.z / len };
  }

  function dot(a, b) {
    return a.x * b.x + a.y * b.y + a.z * b.z;
  }

  // Key light coming from top-right front
  const KEY_LIGHT = normalize({ x: 0.45, y: -0.75, z: 0.65 });

  // Color shading helper
  function shadeColor(hex, lum) {
    hex = String(hex).replace(/[^0-9a-f]/gi, '');
    if (hex.length < 6) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    lum = Math.max(0.12, Math.min(1.4, lum));
    let rgb = '#', c, i;
    for (i = 0; i < 3; i++) {
      c = parseInt(hex.substr(i*2, 2), 16);
      c = Math.round(Math.min(Math.max(0, c * lum), 255)).toString(16);
      rgb += ('00' + c).substr(c.length);
    }
    return rgb;
  }

  /* -------------------------------------------------------------
     3D Geometry Builders for the 6 Mascot Species
     ------------------------------------------------------------- */

  function makeBox(w, h, d, color, edgeColor = '#333b44') {
    const hw = w / 2, hh = h / 2, hd = d / 2;
    const verts = [
      { x: -hw, y: -hh, z: -hd }, { x:  hw, y: -hh, z: -hd },
      { x:  hw, y:  hh, z: -hd }, { x: -hw, y:  hh, z: -hd },
      { x: -hw, y: -hh, z:  hd }, { x:  hw, y: -hh, z:  hd },
      { x:  hw, y:  hh, z:  hd }, { x: -hw, y:  hh, z:  hd }
    ];
    const faces = [
      { indices: [0, 1, 2, 3], color, edgeColor }, // back
      { indices: [5, 4, 7, 6], color, edgeColor }, // front
      { indices: [4, 0, 3, 7], color, edgeColor }, // left
      { indices: [1, 5, 6, 2], color, edgeColor }, // right
      { indices: [4, 5, 1, 0], color, edgeColor }, // top
      { indices: [3, 2, 6, 7], color, edgeColor }  // bottom
    ];
    return { verts, faces };
  }

  function makeIcosahedron(radius, color, edgeColor = '#fff4e2') {
    const t = (1 + Math.sqrt(5)) / 2;
    const r = radius / Math.sqrt(1 + t * t);
    const verts = [
      { x: -r, y:  t*r, z: 0 }, { x:  r, y:  t*r, z: 0 }, { x: -r, y: -t*r, z: 0 }, { x:  r, y: -t*r, z: 0 },
      { x: 0, y: -r, z:  t*r }, { x: 0, y:  r, z:  t*r }, { x: 0, y: -r, z: -t*r }, { x: 0, y:  r, z: -t*r },
      { x:  t*r, y: 0, z: -r }, { x:  t*r, y: 0, z:  r }, { x: -t*r, y: 0, z: -r }, { x: -t*r, y: 0, z:  r }
    ];
    const triIndices = [
      [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
      [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
      [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
      [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]
    ];
    const faces = triIndices.map(idx => ({ indices: idx, color, edgeColor }));
    return { verts, faces };
  }

  class Mascot3DEngine {
    constructor(canvas, options = {}) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.options = Object.assign({
        species: 'gobi',
        scale: 1.0,
        fov: 340,
        isDancing: false,
        autoOrbit: true,
        showPlatform: true,
        interactive: true
      }, options);

      this.currentSpecies = this.options.species;
      this.isDancing = this.options.isDancing;
      this.tick = 0;
      this.animId = null;

      // Camera & Rotation State
      this.rotX = 0.14; // slight tilt down
      this.rotY = 0.0;
      this.rotZ = 0.0;
      this.targetRotX = 0.14;
      this.targetRotY = 0.0;

      // Mouse drag state
      this.isDragging = false;
      this.lastMouseX = 0;
      this.lastMouseY = 0;

      // Dynamic action states
      this.jumpY = 0;
      this.jumpVy = 0;
      this.happinessTimer = 0;
      this.particles = [];
      this.treats = [];

      this.initEvents();
      this.resize();
      this.start();
    }

    initEvents() {
      if (!this.options.interactive) return;

      const c = this.canvas;
      const getPos = (e) => {
        const rect = c.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top,
          normX: (clientX - rect.left - rect.width / 2) / (rect.width / 2),
          normY: (clientY - rect.top - rect.height / 2) / (rect.height / 2)
        };
      };

      c.addEventListener('mousedown', (e) => {
        this.isDragging = true;
        this.lastMouseX = e.clientX;
        this.lastMouseY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (this.isDragging) {
          const dx = e.clientX - this.lastMouseX;
          const dy = e.clientY - this.lastMouseY;
          this.targetRotY += dx * 0.012;
          this.targetRotX += dy * 0.012;
          this.targetRotX = Math.max(-0.6, Math.min(0.7, this.targetRotX));
          this.lastMouseX = e.clientX;
          this.lastMouseY = e.clientY;
        } else {
          // Look-at mouse tracking when hovering
          const rect = c.getBoundingClientRect();
          if (
            e.clientX >= rect.left && e.clientX <= rect.right &&
            e.clientY >= rect.top && e.clientY <= rect.bottom
          ) {
            const p = getPos(e);
            this.targetRotY = p.normX * 0.42;
            this.targetRotX = 0.14 + p.normY * 0.28;
          }
        }
      });

      window.addEventListener('mouseup', () => {
        this.isDragging = false;
      });

      c.addEventListener('click', () => {
        this.triggerJump();
      });
    }

    resize() {
      const dpr = window.devicePixelRatio || 1;
      const rect = this.canvas.getBoundingClientRect();
      const w = rect.width || this.canvas.width || 280;
      const h = rect.height || this.canvas.height || 280;
      this.canvas.width = w * dpr;
      this.canvas.height = h * dpr;
      this.ctx.scale(dpr, dpr);
      this.displayWidth = w;
      this.displayHeight = h;
    }

    setSpecies(name) {
      if (['gobi', 'kittu', 'byte', 'draco', 'nova', 'kitsu'].includes(name)) {
        this.currentSpecies = name;
        this.triggerMorph();
      }
    }

    setDancing(val) {
      this.isDancing = Boolean(val);
    }

    triggerJump() {
      if (this.jumpY === 0) {
        this.jumpVy = -9.0;
        this.happinessTimer = 45;
        this.addSparkles(0, -10, 16, '#fff4e2');
      }
    }

    triggerMorph() {
      this.targetRotY += Math.PI * 2;
      this.addSparkles(0, 0, 20, '#e08c33');
    }

    feedTreat(type = 'cookie') {
      const colors = {
        cookie: '#e08c33',
        fish: '#fff4e2',
        energy: '#4cc061',
        ember: '#ff5533',
        pearl: '#e8f4fc'
      };
      this.treats.push({
        x: (Math.random() - 0.5) * 30,
        y: -90,
        z: 20 + Math.random() * 20,
        vy: 2.0,
        rot: 0,
        color: colors[type] || '#fff4e2'
      });
      this.happinessTimer = 60;
    }

    addSparkles(x, y, count = 12, color = '#fff4e2') {
      for (let i = 0; i < count; i++) {
        this.particles.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y + (Math.random() - 0.5) * 20,
          z: (Math.random() - 0.5) * 30,
          vx: (Math.random() - 0.5) * 3.5,
          vy: -Math.random() * 3.5 - 1.2,
          vz: (Math.random() - 0.5) * 3.5,
          life: 1.0,
          decay: 0.02 + Math.random() * 0.02,
          color: color,
          size: Math.random() * 2.8 + 1.6
        });
      }
    }

    start() {
      if (!this.animId) {
        const loop = () => {
          this.render();
          this.animId = requestAnimationFrame(loop);
        };
        this.animId = requestAnimationFrame(loop);
      }
    }

    stop() {
      if (this.animId) {
        cancelAnimationFrame(this.animId);
        this.animId = null;
      }
    }

    render() {
      this.tick++;
      const ctx = this.ctx;
      const w = this.displayWidth || 280;
      const h = this.displayHeight || 280;
      const cx = w / 2;
      const cy = h / 2 + 10;

      ctx.clearRect(0, 0, w, h);

      // Smooth camera interpolation
      if (!this.isDragging && this.options.autoOrbit) {
        this.rotY += 0.007; // gentle idle orbit
      }
      this.rotX += (this.targetRotX - this.rotX) * 0.08;
      this.rotY += (this.targetRotY - this.rotY) * 0.08;

      // Jump & Bounce Physics
      if (this.jumpVy !== 0 || this.jumpY !== 0) {
        this.jumpY += this.jumpVy;
        this.jumpVy += 0.52; // gravity
        if (this.jumpY >= 0) {
          this.jumpY = 0;
          this.jumpVy = 0;
        }
      }

      const danceBounce = this.isDancing ? Math.sin(this.tick * 0.16) * 12 : Math.sin(this.tick * 0.05) * 3.5;
      const danceRoll = this.isDancing ? Math.cos(this.tick * 0.16) * 0.08 : 0;
      const mascotY = this.jumpY + danceBounce;

      // 1. Draw 3D Platform (Holographic Wireframe Pedestal)
      if (this.options.showPlatform) {
        this.drawPlatform(ctx, cx, cy, this.rotX, this.rotY);
      }

      // 2. Gather 3D Polygons for Current Species
      const sceneFaces = this.buildSpeciesGeometry(this.currentSpecies, mascotY, danceRoll);

      // 3. Transform, Light, and Project
      const projectedFaces = [];
      const fov = this.options.fov;
      const scale = this.options.scale;

      for (const face of sceneFaces) {
        const worldVerts = [];
        let sumZ = 0;

        for (const v of face.verts) {
          const transformed = transformVertex(v, this.rotX, this.rotY, this.rotZ + danceRoll, 0, mascotY, 0);
          worldVerts.push(transformed);
          sumZ += transformed.z;
        }

        const avgZ = sumZ / worldVerts.length;
        const depth = avgZ + fov;
        if (depth <= 10) continue; // behind camera

        // Calculate face normal using first 3 vertices
        if (worldVerts.length >= 3) {
          const v0 = worldVerts[0], v1 = worldVerts[1], v2 = worldVerts[2];
          const edge1 = { x: v1.x - v0.x, y: v1.y - v0.y, z: v1.z - v0.z };
          const edge2 = { x: v2.x - v0.x, y: v2.y - v0.y, z: v2.z - v0.z };
          const normal = normalize(crossProduct(edge1, edge2));

          // Backface culling for solid meshes (unless doubleSided is true)
          if (!face.doubleSided && normal.z >= 0.05) {
            continue;
          }

          // Volumetric Diffuse Lighting
          const diffuse = Math.max(0, dot(normal, KEY_LIGHT));
          const lum = face.emissive ? 1.3 : 0.32 + diffuse * 0.78;
          const shadedColor = face.rawColor ? face.color : shadeColor(face.color, lum);

          // Project 3D -> 2D
          const screenPts = worldVerts.map(pt => {
            const f = fov / (pt.z + fov);
            return {
              x: cx + pt.x * scale * f,
              y: cy + pt.y * scale * f
            };
          });

          projectedFaces.push({
            pts: screenPts,
            avgZ: avgZ,
            fillColor: shadedColor,
            edgeColor: face.edgeColor || '#333b44',
            lineWidth: face.lineWidth || 1.1,
            emissive: face.emissive || false
          });
        }
      }

      // 4. Depth Sort (Painter's Algorithm: Furthest First)

      for (const f of projectedFaces) {
        ctx.beginPath();
        ctx.moveTo(f.pts[0].x, f.pts[0].y);
        for (let i = 1; i < f.pts.length; i++) {
          ctx.lineTo(f.pts[i].x, f.pts[i].y);

        ctx.closePath();

        mascotEngine.targetRotY = normX * 0.45;

      }
    });

   Procedural Sound Synthesizer (Web Audio API)
   ========================================================================== */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }
  async init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
    }
    if (this.ctx.state === 'suspended') {
      await this.ctx.resume();
    }
    return this.ctx;
  }
  async playPurr() {
    if (this.muted) return;
    const ctx = await this.init();
    if (!ctx) return;
    try {
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(740, now + 0.14);
      osc.frequency.exponentialRampToValueAtTime(420, now + 0.32);
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.16, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.35);
    } catch(e) {}
  }
  async playChime() {
    if (this.muted) return;
    const ctx = await this.init();
    if (!ctx) return;
    try {
      const now = ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.07);
        gain.gain.setValueAtTime(0.08, now + idx * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.07);
        osc.stop(now + idx * 0.07 + 0.29);
      });
    } catch(e) {}
  }
}

const SPECIES = ['gobi', 'kittu', 'byte', 'draco', 'nova', 'kitsu'];
const NAMES = {
  gobi: 'Gobi',
  kittu: 'Kittu',
  byte: 'Byte',
  draco: 'Draco',
  nova: 'Nova',
  kitsu: 'Kitsu'
};
const ROLES = {
  gobi: 'AI Kitten • Beat Sync',
  kittu: 'Cyber Shiba • Guard',
  byte: 'Glitch Sprite • Code',
  draco: 'Mini Dragon • Compute',
  nova: 'Astral Orb • Focus',
  kitsu: 'Kitsune • Vault'
};
const ICONS = {
  gobi: '🐱',
  kittu: '🐕',
  byte: '👾',
  draco: '🐉',
  nova: '🔮',
  kitsu: '🦊'
};

const API_BASE = (window.location.protocol.startsWith('http'))
  ? window.location.origin
  : 'http://127.0.0.1:8888';

let currentSpeciesIdx = 0;
let isDancing = false;

function setSpecies(idx, syncServer = true) {
  currentSpeciesIdx = (idx + SPECIES.length) % SPECIES.length;
  const sp = SPECIES[currentSpeciesIdx];
  const name = NAMES[sp];
  
  if (typeof mascotEngine !== 'undefined') mascotEngine.setSpecies(sp);
  document.getElementById('pill-name').textContent = name;
  document.getElementById('bubble-species-name').textContent = `${name.toUpperCase()} // ${ROLES[sp].toUpperCase()}`;
  document.getElementById('bubble-species-icon').textContent = ICONS[sp];

  if (syncServer && window.pywebview && window.pywebview.api && window.pywebview.api.save_pet_state) {
    try {
      window.pywebview.api.save_pet_state({ species: sp, name: name });
    } catch(e) {}
  }
}

async function initPetState() {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.get_pet_state) {
    try {
      const saved = await window.pywebview.api.get_pet_state();
      if (saved && saved.species) {
        const found = SPECIES.indexOf(saved.species);
        if (found !== -1) {
          setSpecies(found, false);
          return;
        }
      }
    } catch(e) {}
  }
  setSpecies(0, false);
}
initPetState();

// Elements & Listeners
const petWrap = document.getElementById('pet-wrap');
const speechBubble = document.getElementById('speech-bubble');
const bubbleClose = document.getElementById('bubble-close');
const bubbleText = document.getElementById('bubble-text');
const bubbleInp = document.getElementById('bubble-inp');
const bubbleSend = document.getElementById('bubble-send');
const pillMood = document.getElementById('pill-mood');

petWrap.addEventListener('click', () => {
  if (typeof mascotEngine !== 'undefined') mascotEngine.triggerJump();
  sounds.playPurr();
  speechBubble.classList.toggle('active');
  if (speechBubble.classList.contains('active')) {
    bubbleInp.focus();
  }
  // Instantly bring main KALKI workspace to the foreground
  if (window.pywebview && window.pywebview.api && window.pywebview.api.open_main_app) {
    window.pywebview.api.open_main_app();
  }
});

bubbleClose.addEventListener('click', () => {
  speechBubble.classList.remove('active');
});

document.getElementById('chip-open-kalki').addEventListener('click', () => {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.open_main_app) {
    window.pywebview.api.open_main_app();
  }
  bubbleText.innerHTML = "Restoring main KALKI workspace...";
});

document.querySelectorAll('.q-chip[data-cmd]').forEach(chip => {
  chip.addEventListener('click', () => {
    sendQuery(chip.getAttribute('data-cmd'));
  });
});

document.getElementById('btn-next-pet').addEventListener('click', () => {
  sounds.playChime();
  setSpecies(currentSpeciesIdx + 1, true);
});

const btnSound = document.getElementById('btn-pet-sound');
btnSound.addEventListener('click', () => {
  sounds.muted = !sounds.muted;
  btnSound.textContent = sounds.muted ? '🔇' : '🔊';
  if (!sounds.muted) sounds.playPurr();
});

document.getElementById('btn-pet-wake').addEventListener('click', () => {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.open_main_app) {
    window.pywebview.api.open_main_app();
  }
});

// Query Dispatcher to Loopback API
async function sendQuery(q) {
  if (!q.trim()) return;
  sounds.playChime();
  bubbleText.innerHTML = "<em>Thinking...</em>";
  speechBubble.classList.add('active');
  pillMood.textContent = "Processing";

  try {
    const res = await fetch(`${API_BASE}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [{ role: 'user', content: q.trim() }],
        source: 'desktop_pet',
        stream: false
      })
    });
    const data = await res.json();
    if (data.reply) {
      bubbleText.innerHTML = data.reply.replace(/\n/g, '<br>');
      pillMood.textContent = "Ready";
    } else {
      bubbleText.textContent = "Request processed.";
      pillMood.textContent = "Ready";
    }
  } catch (err) {
    // If backend is busy, still acknowledge
    bubbleText.textContent = `Command "${q}" dispatched. Restoring workspace...`;
    pillMood.textContent = "Ready";
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.open_main_app();
    }
  }
}

bubbleInp.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const v = bubbleInp.value;
    bubbleInp.value = '';
    sendQuery(v);
  }
});

bubbleSend.addEventListener('click', () => {
  const v = bubbleInp.value;
  bubbleInp.value = '';
  sendQuery(v);
});

// Music & Dance Loop
function spawnNote() {
  const note = document.createElement('div');
  note.className = 'floating-note';
  note.textContent = ['♪', '♫', '♬', '✨'][Math.floor(Math.random() * 4)];
  note.style.left = `${30 + Math.random() * 50}px`;
  note.style.bottom = `${80 + Math.random() * 20}px`;
  petWrap.appendChild(note);
  setTimeout(() => note.remove(), 1200);
}

setInterval(async () => {
  let media = null;
  // First attempt native Python WinRT query
  if (window.pywebview && window.pywebview.api && window.pywebview.api.get_music_state) {
    try {
      media = await window.pywebview.api.get_music_state();
    } catch(e) {}
  }
  // Fallback to loopback HTTP
  if (!media) {
    try {
      const r = await fetch(`${API_BASE}/api/media/now_json`);
      if (r.ok) media = await r.json();
    } catch(e) {}
  }

  if (media) {
    const playing = media.status === 'playing' || (media.title && media.title !== 'Nothing playing' && media.title !== 'Unknown');
    if (playing !== isDancing) {
      isDancing = playing;
      petWrap.classList.toggle('is-dancing', isDancing);
      if (typeof mascotEngine !== 'undefined') mascotEngine.setDancing(isDancing);
      pillMood.textContent = isDancing ? "Jamming ♪" : "Ready";
      if (isDancing) {
        bubbleText.textContent = `Grooving to ${media.title || 'music'}!`;
      }
    }
    if (isDancing && Math.random() > 0.4) {
      spawnNote();
    }
  }
}, 1600);
</script>
