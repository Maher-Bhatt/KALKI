<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d0f12">
<title>KALKI</title>
<link rel="icon" href="/assets/kalki_icon.ico">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/base.css">
<link rel="stylesheet" href="/ui/app.css">
<style>
  /* Boot screen only. Everything else lives in the stylesheets above. */
  #boot {
    position: fixed; inset: 0; z-index: 3000;
    display: grid; place-items: center;
    background: var(--surface-void, #070809);
    color: var(--text-muted, #8a95a1);
    font: 400 .8125rem/1.1875rem "Instrument Sans", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  #boot .mark {
    width: .75rem; height: .75rem; border-radius: 50%;
    background: #fff4e2; opacity: .22; margin: 0 auto .75rem;
  }
  #boot.gone { display: none; }
  noscript { display: block; padding: 2rem; color: #e6ebef; }
</style>
</head>
<body>
  <div id="boot"><div><div class="mark"></div>Starting KALKI</div></div>
  <div id="app"></div>
  <noscript>KALKI needs JavaScript. If you are seeing this inside the desktop app, the WebView runtime failed to start — reinstall the Microsoft Edge WebView2 Runtime and launch KALKI again.</noscript>
  <script type="module" src="/ui/main.js"></script>
  <script nomodule>
    document.getElementById('boot').textContent =
      'This build of KALKI needs a modern WebView. Install the Microsoft Edge WebView2 Runtime and restart.';
  </script>
</body>
</html>
