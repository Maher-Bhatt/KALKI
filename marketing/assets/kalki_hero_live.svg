<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgRadial" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Center Ambient Glow -->
    <radialGradient id="centerAura" cx="35%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 243, 255, 0.18)"/>
      <stop offset="50%" stop-color="rgba(168, 85, 247, 0.1)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="kalkiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f7ff"/>
      <stop offset="75%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Equalizer Gradient -->
    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Core Filters -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      
      @keyframes scanMotion {
        0% { transform: translateY(-340px); }
        100% { transform: translateY(340px); }
      }

      @keyframes ringPulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.06); opacity: 1; }
      }

      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .scanline {
        animation: scanMotion 7s linear infinite;
      }

      .pulse-ring {
        transform-origin: 100px 170px;
        animation: ringPulse 3s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect x="2" y="2" width="956" height="336" rx="22" fill="url(#bgRadial)"/>

  <!-- Ambient Glowing Aura Behind Logo -->
  <circle cx="280" cy="170" r="220" fill="url(#centerAura)"/>

  <!-- Cyber Grid Lines -->
  <g opacity="0.06" stroke="#00f3ff" stroke-width="1">
    <line x1="0" y1="56" x2="960" y2="56"/>
    <line x1="0" y1="112" x2="960" y2="112"/>
    <line x1="0" y1="170" x2="960" y2="170"/>
    <line x1="0" y1="228" x2="960" y2="228"/>
    <line x1="0" y1="284" x2="960" y2="284"/>
    <line x1="160" y1="0" x2="160" y2="340"/>
    <line x1="320" y1="0" x2="320" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/>
    <line x1="640" y1="0" x2="640" y2="340"/>
    <line x1="800" y1="0" x2="800" y2="340"/>
  </g>

  <!-- Animated Scanline Glass Layer -->
  <g class="scanline" opacity="0.12">
    <rect x="2" y="0" width="956" height="140" fill="url(#borderGlow)"/>
  </g>

  <!-- Outer Glass Frame -->
  <rect x="2" y="2" width="956" height="336" rx="22" fill="none" stroke="url(#borderGlow)" stroke-width="1.8" opacity="0.85"/>
  <rect x="5" y="5" width="950" height="330" rx="19" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>

  <!-- Top Status Bar -->
  <g transform="translate(40, 32)">
    <!-- Version Chip -->
    <rect x="0" y="0" width="180" height="28" rx="14" fill="rgba(0, 243, 255, 0.08)" stroke="rgba(0, 243, 255, 0.3)" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#00f3ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" fill="#00f3ff" class="mono" font-size="11" font-weight="700" letter-spacing="1">SYSTEM // v1.4.2</text>

    <!-- Defender Status Chip -->
    <g transform="translate(195, 0)">
      <rect x="0" y="0" width="190" height="28" rx="14" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <circle cx="16" cy="14" r="4.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="18" fill="#10b981" class="mono" font-size="11" font-weight="700" letter-spacing="1">SHIELDCORE: ACTIVE</text>
    </g>

    <!-- Model Auto-Router Chip -->
    <g transform="translate(700, 0)">
      <rect x="0" y="0" width="180" height="28" rx="14" fill="rgba(168, 85, 247, 0.08)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
      <circle cx="16" cy="14" r="4.5" fill="#a855f7">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="18" fill="#c084fc" class="mono" font-size="11" font-weight="700" letter-spacing="1">ROUTER: COGNITIVE</text>
    </g>
  </g>

  <!-- Central Holographic Mascot & Typography Hub -->
  <g transform="translate(50, 95)">
    <!-- 3D Cyber Reactor Hex Core -->
    <g transform="translate(0, 5)">
      <!-- Outer Pulsing Ring -->
      <polygon points="50,5 95,30 95,85 50,110 5,85 5,30" fill="rgba(0, 243, 255, 0.06)" stroke="#00f3ff" stroke-width="2" class="pulse-ring" filter="url(#softGlow)"/>
      
      <!-- Inner Core Hexagon -->
      <polygon points="50,18 83,38 83,77 50,97 17,77 17,38" fill="#060911" stroke="#a855f7" stroke-width="2.5" filter="url(#softGlow)"/>
      
      <!-- Center Reactor Glowing Sphere -->
      <circle cx="50" cy="57" r="16" fill="url(#borderGlow)" filter="url(#neonBlur)">
        <animate attributeName="r" values="14;18;14" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="57" r="8" fill="#ffffff"/>
      
      <!-- Corner Energy Nodes -->
      <circle cx="5" cy="30" r="3" fill="#00f3ff"/>
      <circle cx="95" cy="30" r="3" fill="#00f3ff"/>
      <circle cx="95" cy="85" r="3" fill="#a855f7"/>
      <circle cx="5" cy="85" r="3" fill="#a855f7"/>
    </g>

    <!-- Main Title: KALKI -->
    <g transform="translate(130, 0)">
      <text x="0" y="72" fill="url(#kalkiGrad)" class="sans" font-size="68" font-weight="900" letter-spacing="-1.5" filter="url(#softGlow)">
        KALKI
      </text>
      
      <!-- Gradient Badge for AI Operating System -->
      <rect x="250" y="24" width="180" height="34" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)"/>
      <text x="264" y="47" fill="#f8fafc" class="sans" font-size="17" font-weight="800" letter-spacing="1">DESKTOP AI</text>

      <!-- Subtitle -->
      <text x="2" y="104" fill="#94a3b8" class="mono" font-size="13" font-weight="600" letter-spacing="2">
        SOVEREIGN WORKSPACE • DESKTOP COMPANION PET • SHIELDCORE DEFENSE
      </text>
    </g>
  </g>

  <!-- Bottom Capabilities & Animated Equalizer Waves -->
  <g transform="translate(50, 248)">
    <!-- Pill 1: 100% Local -->
    <rect x="0" y="0" width="150" height="36" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(0, 243, 255, 0.25)" stroke-width="1.2"/>
    <text x="18" y="23" fill="#e2e8f0" class="mono" font-size="11.5" font-weight="600">● 100% LOCAL-FIRST</text>

    <!-- Pill 2: Zero Telemetry -->
    <g transform="translate(162, 0)">
      <rect x="0" y="0" width="155" height="36" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(0, 243, 255, 0.25)" stroke-width="1.2"/>
      <text x="18" y="23" fill="#e2e8f0" class="mono" font-size="11.5" font-weight="600">● ZERO TELEMETRY</text>
    </g>

    <!-- Pill 3: 12 Cyber Tools -->
    <g transform="translate(329, 0)">
      <rect x="0" y="0" width="155" height="36" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.2"/>
      <text x="18" y="23" fill="#34d399" class="mono" font-size="11.5" font-weight="600">● 12 CYBER TOOLS</text>
    </g>

    <!-- Pill 4: Codex Pet -->
    <g transform="translate(496, 0)">
      <rect x="0" y="0" width="165" height="36" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.2"/>
      <text x="18" y="23" fill="#c084fc" class="mono" font-size="11.5" font-weight="600">● CODEX PET OVERLAY</text>
    </g>

    <!-- Real High-Fidelity Audio Equalizer (Native Animated SVG Rectangles) -->
    <g transform="translate(685, -15)">
      <text x="0" y="14" fill="#64748b" class="mono" font-size="10" font-weight="700" letter-spacing="1">AUDIO ENGINE // 60FPS</text>
      
      <!-- Bars with SVG <animate> tags for universal browser & GitHub compatibility -->
      <!-- Bar 1 -->
      <rect x="0" y="32" width="6" height="18" rx="3" fill="url(#eqGrad)">
        <animate attributeName="height" values="10;32;14;28;10" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="40;18;36;22;40" dur="0.9s" repeatCount="indefinite"/>
      </rect>

      <!-- Bar 2 -->
      <rect x="11" y="26" width="6" height="24" rx="3" fill="url(#eqGrad)">
        <animate attributeName="height" values="24;12;36;18;24" dur="0.75s" repeatCount="indefinite"/>
        <animate attributeName="y" values="26;38;14;32;26" dur="0.75s" repeatCount="indefinite"/>
      </rect>

      <!-- Bar 3 -->
      <rect x="22" y="20" width="6" height="30" rx="3" fill="url(#eqGrad)">
        <animate attributeName="height" values="30;14;38;20;30" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="20;36;12;30;20" dur="1.1s" repeatCount="indefinite"/>
      </rect>

      <!-- Bar 4 -->
      <rect x="33" y="28" width="6" height="22" rx="3" fill="url(#eqGrad)">
        <animate attributeName="height" values="16;38;22;30;16" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="34;12;28;20;34" dur="0.8s" repeatCount="indefinite"/>
      </rect>

      <!-- Bar 5 -->
      <rect x="44" y="22" width="6" height="28" rx="3" fill="url(#eqGrad)">
        <animate attributeName="height" values="28;16;34;12;28" dur="1.0s" repeatCount="indefinite"/>
        <animate attributeName="y" values="22;34;16;38;22" dur="1.0s" repeatCount="indefinite"/>
      </rect>

      <!-- Bar 6 -->
      <rect x="55" y="16" width="6" height="34" rx="3" fill="url(#eqGrad)">
        <animate attributeName="height" values="34;20;14;38;34" dur="0.85s" repeatCount="indefinite"/>
        <animate attributeName="y" values="16;30;36;12;16" dur="0.85s" repeatCount="indefinite"/>
      </rect>

      <!-- Bar 7 -->
      <rect x="66" y="30" width="6" height="20" rx="3" fill="url(#eqGrad)">
        <animate attributeName="height" values="20;36;16;32;20" dur="0.95s" repeatCount="indefinite"/>
        <animate attributeName="y" values="30;14;34;18;30" dur="0.95s" repeatCount="indefinite"/>
      </rect>

      <!-- Bar 8 -->
      <rect x="77" y="24" width="6" height="26" rx="3" fill="url(#eqGrad)">
        <animate attributeName="height" values="26;12;34;18;26" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="24;38;16;32;24" dur="0.7s" repeatCount="indefinite"/>
      </rect>

      <!-- Bar 9 -->
      <rect x="88" y="18" width="6" height="32" rx="3" fill="url(#eqGrad)">
        <animate attributeName="height" values="32;18;38;14;32" dur="1.05s" repeatCount="indefinite"/>
        <animate attributeName="y" values="18;32;12;36;18" dur="1.05s" repeatCount="indefinite"/>
      </rect>

      <!-- Bar 10 -->
      <rect x="99" y="32" width="6" height="18" rx="3" fill="url(#eqGrad)">
        <animate attributeName="height" values="14;28;10;34;14" dur="0.88s" repeatCount="indefinite"/>
        <animate attributeName="y" values="36;22;40;16;36" dur="0.88s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
