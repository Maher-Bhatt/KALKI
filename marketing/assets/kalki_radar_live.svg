<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%">
  <defs>
    <!-- Cold Machined Graphite Radial Background -->
    <radialGradient id="radarBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#191d22"/>
      <stop offset="60%" stop-color="#0d0f12"/>
      <stop offset="100%" stop-color="#070809"/>
    </radialGradient>

    <!-- Radar Sweep Beam Conic Equivalent Gradient -->
    <linearGradient id="beamFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(76, 192, 97, 0.5)"/>
      <stop offset="70%" stop-color="rgba(76, 192, 97, 0.08)"/>
      <stop offset="100%" stop-color="rgba(76, 192, 97, 0)"/>
    </linearGradient>

    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono-text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="456" height="276" rx="18" fill="url(#radarBg)" stroke="#333b44" stroke-width="1.6"/>

  <!-- Top Status Badge -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="195" height="26" rx="13" fill="rgba(76, 192, 97, 0.1)" stroke="rgba(76, 192, 97, 0.35)" stroke-width="1"/>
    <circle cx="13" cy="13" r="4.5" fill="#4cc061">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" fill="#4cc061" class="mono-text" font-size="10.5" font-weight="700">SHIELDCORE ANTIVIRUS</text>
  </g>

  <g transform="translate(325, 20)">
    <rect x="0" y="0" width="110" height="26" rx="13" fill="rgba(76, 192, 97, 0.1)" stroke="rgba(76, 192, 97, 0.3)" stroke-width="1"/>
    <circle cx="13" cy="13" r="4.5" fill="#4cc061"/>
    <text x="24" y="17" fill="#4cc061" class="mono-text" font-size="10.5" font-weight="700">0 THREATS</text>
  </g>

  <!-- Radar Scope on the Left -->
  <g transform="translate(10, 0)">
    <!-- Concentric Circles -->
    <circle cx="105" cy="145" r="85" fill="#0a0c0e" stroke="rgba(76, 192, 97, 0.25)" stroke-width="1.2"/>
    <circle cx="105" cy="145" r="60" fill="none" stroke="rgba(76, 192, 97, 0.2)" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="105" cy="145" r="35" fill="none" stroke="rgba(76, 192, 97, 0.25)" stroke-width="1"/>
    <circle cx="105" cy="145" r="12" fill="none" stroke="rgba(76, 192, 97, 0.35)" stroke-width="1"/>

    <!-- Crosshairs -->
    <line x1="20" y1="145" x2="190" y2="145" stroke="rgba(76, 192, 97, 0.25)" stroke-width="1"/>
    <line x1="105" y1="60" x2="105" y2="230" stroke="rgba(76, 192, 97, 0.25)" stroke-width="1"/>

    <!-- Sweeping Radar Beam with Native SVG <animateTransform> -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 105 145" to="360 105 145" dur="3s" repeatCount="indefinite"/>
      <path d="M 105 145 L 105 60 A 85 85 0 0 1 180 105 Z" fill="url(#beamFade)"/>
      <line x1="105" y1="145" x2="180" y2="105" stroke="#4cc061" stroke-width="1.6" filter="url(#radarGlow)"/>
    </g>

    <!-- Radar Target Blips with Native Animation (Filament Warm Light & Green) -->
    <circle cx="75" cy="125" r="3.5" fill="#4cc061" filter="url(#radarGlow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;4.5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="135" cy="165" r="3.5" fill="#fff4e2" filter="url(#radarGlow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;4.5;3" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Radar Center Hub: Warm Presence Filament -->
    <circle cx="105" cy="145" r="4.5" fill="#fff4e2" filter="url(#radarGlow)"/>
  </g>

  <!-- Telemetry Console Output on the Right -->
  <g transform="translate(225, 62)">
    <rect x="0" y="0" width="210" height="168" rx="10" fill="#0a0c0e" stroke="#333b44" stroke-width="1"/>
    
    <text x="14" y="24" fill="#fff4e2" class="mono-text" font-size="11" font-weight="700">&gt; DEFENSE TELEMETRY</text>
    <line x1="14" y1="32" x2="196" y2="32" stroke="#232930" stroke-width="1"/>

    <text x="14" y="52" fill="#8a95a1" class="mono-text" font-size="9.5">Defender Engine:</text>
    <text x="135" y="52" fill="#4cc061" class="mono-text" font-size="9.5" font-weight="700">Healthy</text>

    <text x="14" y="73" fill="#8a95a1" class="mono-text" font-size="9.5">Entropy Heuristic:</text>
    <text x="135" y="73" fill="#4cc061" class="mono-text" font-size="9.5" font-weight="700">0 Flags</text>

    <text x="14" y="94" fill="#8a95a1" class="mono-text" font-size="9.5">Miner PIDs:</text>
    <text x="135" y="94" fill="#4cc061" class="mono-text" font-size="9.5" font-weight="700">0 Active</text>

    <text x="14" y="115" fill="#8a95a1" class="mono-text" font-size="9.5">Anti-Clipper:</text>
    <text x="135" y="115" fill="#4cc061" class="mono-text" font-size="9.5" font-weight="700">Armed</text>

    <text x="14" y="136" fill="#8a95a1" class="mono-text" font-size="9.5">Local Port Scan:</text>
    <text x="135" y="136" fill="#4cc061" class="mono-text" font-size="9.5" font-weight="700">Secured</text>

    <line x1="14" y1="145" x2="196" y2="145" stroke="#232930" stroke-width="1"/>
    <text x="14" y="158" fill="#fff4e2" class="mono-text" font-size="9.5" font-weight="700">12 Cyber Tools Ready</text>
  </g>
</svg>