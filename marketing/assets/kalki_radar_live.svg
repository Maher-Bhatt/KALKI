<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%">
  <defs>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="60%" stop-color="#030c0a"/>
      <stop offset="100%" stop-color="#010504"/>
    </radialGradient>

    <!-- Radar Sweep Beam Conic Gradient Equivalent -->
    <linearGradient id="beamFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.6)"/>
      <stop offset="70%" stop-color="rgba(16, 185, 129, 0.05)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0)"/>
    </linearGradient>

    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono-text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      
      @keyframes radarSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes blipPulse {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      .beam {
        animation: radarSpin 3.2s linear infinite;
        transform-origin: 105px 145px;
      }

      .blip1 { animation: blipPulse 1.8s infinite ease-in-out; transform-origin: 75px 125px; }
      .blip2 { animation: blipPulse 2.4s infinite ease-in-out 0.6s; transform-origin: 135px 165px; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="456" height="276" rx="16" fill="url(#radarBg)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>

  <!-- Top Status Badge -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="190" height="24" rx="12" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#10b981"/>
    <text x="24" y="16" fill="#34d399" class="mono-text" font-size="10" font-weight="700">SHIELDCORE ANTIVIRUS</text>
  </g>

  <g transform="translate(320, 20)">
    <text x="0" y="16" fill="#10b981" class="mono-text" font-size="11" font-weight="600">● 0 THREATS</text>
  </g>

  <!-- Radar Scope on the Left -->
  <g transform="translate(10, 0)">
    <!-- Concentric Circles -->
    <circle cx="105" cy="145" r="85" fill="#01140e" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>
    <circle cx="105" cy="145" r="60" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="105" cy="145" r="35" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <circle cx="105" cy="145" r="12" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>

    <!-- Crosshairs -->
    <line x1="20" y1="145" x2="190" y2="145" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>
    <line x1="105" y1="60" x2="105" y2="230" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>

    <!-- Sweeping Radar Beam -->
    <g class="beam">
      <path d="M 105 145 L 105 60 A 85 85 0 0 1 180 105 Z" fill="url(#beamFade)"/>
      <line x1="105" y1="145" x2="180" y2="105" stroke="#10b981" stroke-width="1.5" filter="url(#radarGlow)"/>
    </g>

    <!-- Radar Target Blips -->
    <g class="blip1">
      <circle cx="75" cy="125" r="3.5" fill="#34d399" filter="url(#radarGlow)"/>
    </g>
    <g class="blip2">
      <circle cx="135" cy="165" r="3.5" fill="#00f3ff" filter="url(#radarGlow)"/>
    </g>

    <!-- Radar Center Hub -->
    <circle cx="105" cy="145" r="4" fill="#10b981" filter="url(#radarGlow)"/>
  </g>

  <!-- Telemetry Console Output on the Right -->
  <g transform="translate(225, 62)">
    <rect x="0" y="0" width="210" height="165" rx="8" fill="rgba(0, 0, 0, 0.6)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1"/>
    
    <text x="14" y="24" fill="#34d399" class="mono-text" font-size="11" font-weight="700">&gt; DEFENSE TELEMETRY</text>
    <line x1="14" y1="32" x2="196" y2="32" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>

    <text x="14" y="50" fill="#94a3b8" class="mono-text" font-size="9.5">Defender Engine:</text>
    <text x="135" y="50" fill="#10b981" class="mono-text" font-size="9.5" font-weight="700">Healthy</text>

    <text x="14" y="70" fill="#94a3b8" class="mono-text" font-size="9.5">Entropy Heuristic:</text>
    <text x="135" y="70" fill="#10b981" class="mono-text" font-size="9.5" font-weight="700">0 Flags</text>

    <text x="14" y="90" fill="#94a3b8" class="mono-text" font-size="9.5">Miner PIDs:</text>
    <text x="135" y="90" fill="#10b981" class="mono-text" font-size="9.5" font-weight="700">0 Active</text>

    <text x="14" y="110" fill="#94a3b8" class="mono-text" font-size="9.5">Anti-Clipper:</text>
    <text x="135" y="110" fill="#10b981" class="mono-text" font-size="9.5" font-weight="700">Armed</text>

    <text x="14" y="130" fill="#94a3b8" class="mono-text" font-size="9.5">Quarantine Vault:</text>
    <text x="135" y="130" fill="#10b981" class="mono-text" font-size="9.5" font-weight="700">Isolated</text>

    <text x="14" y="150" fill="#00f3ff" class="mono-text" font-size="9.5" font-weight="700">12 Cyber Tools Ready</text>
  </g>

  <!-- Bottom Spec Footnote -->
  <g transform="translate(24, 252)">
    <text x="0" y="0" fill="#64748b" class="mono-text" font-size="10.5">
      PowerShell Get-MpComputerStatus • Shannon Byte Entropy • icacls Vault
    </text>
  </g>
</svg>
